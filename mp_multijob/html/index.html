<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Multijob UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #1a1b24;
            --bg-card: #252736;
            --bg-card-hover: #2a2d3e;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: transparent;
            margin: 0;
            overflow: hidden;
        }

        #ui-container {
            opacity: 0;
            visibility: hidden;
            transform: translate(40px, -50%);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.4s;
        }

        #ui-container.ui-open {
            opacity: 1;
            visibility: visible;
            transform: translate(0, -50%);
        }

        .view-container {
            transition: opacity 0.25s ease, transform 0.25s ease;
            opacity: 1;
            transform: translateX(0);
        }

        .view-hidden {
            display: none !important;
        }

        .view-exit-left {
            opacity: 0;
            transform: translateX(-20px);
        }

        .view-exit-right {
            opacity: 0;
            transform: translateX(20px);
        }

        .view-enter-from-right {
            opacity: 0;
            transform: translateX(20px);
        }

        .view-enter-from-left {
            opacity: 0;
            transform: translateX(-20px);
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>

    <div id="app-wrapper" class="fixed inset-0 pointer-events-none select-none">

        <div id="ui-container" class="absolute top-1/2 right-[2vw] -translate-y-1/2 w-[420px] bg-[#1a1b24] rounded-[24px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col text-white pointer-events-auto border border-white/5 overflow-hidden">

            <div id="view-list" class="view-container flex flex-col h-full w-full">
                <div class="flex justify-between items-start p-6 pb-5 border-b border-white/5">
                    <div>
                        <div class="text-[#4185f4] text-xs font-bold tracking-widest uppercase mb-1">MP.Multijob</div>
                        <div class="text-2xl font-extrabold uppercase tracking-tight" data-i18n="ui_my_jobs"></div>
                    </div>
                    <button class="btn-close bg-white/5 p-2 rounded-xl hover:bg-white/10 hover:scale-105 active:scale-95 transition-all duration-200 text-white/70 hover:text-white mt-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div id="job-list" class="p-6 flex flex-col gap-3"></div>
            </div>

            <div id="view-details" class="view-container view-hidden flex flex-col h-full w-full">
                <div class="flex items-start p-6 pb-5 border-b border-white/5 gap-4">
                    <button id="btn-back" class="bg-white/5 p-2.5 rounded-xl hover:bg-white/10 hover:-translate-x-1 active:scale-95 transition-all duration-200 text-white/70 hover:text-white mt-1">
                        <i data-lucide="chevron-left" class="w-5 h-5" style="stroke-width: 2.5px;"></i>
                    </button>
                    <div class="flex-1 overflow-hidden">
                        <div class="text-[#4185f4] text-xs font-bold tracking-widest uppercase mb-1">MP.Multijob</div>
                        <div id="d-title" class="text-2xl font-extrabold uppercase tracking-tight truncate"></div>
                    </div>
                    <button class="btn-close bg-white/5 p-2 rounded-xl hover:bg-white/10 hover:scale-105 active:scale-95 transition-all duration-200 text-white/70 hover:text-white mt-1">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="p-6">
                    <div class="bg-[#252736] p-5 rounded-2xl mb-4 hover:bg-[#2a2d3e] transition-colors duration-300">
                        <div id="d-label" class="text-xl font-bold mb-1"></div>
                        <div class="text-sm font-medium flex items-center text-[#8c92a5] flex-wrap gap-y-1">
                            <span id="d-grade"></span>
                            <span id="d-pay-wrap">
                                <span class="mx-2 opacity-50">•</span>
                                <span id="d-pay" class="text-[#34d399]"></span>
                            </span>
                            <span id="d-current-wrap" class="hidden">
                                <span class="mx-2 opacity-50">•</span>
                                <span class="text-[#4185f4]" data-i18n="ui_current_job_short"></span>
                            </span>
                        </div>
                    </div>

                    <div id="d-stats">
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-[#252736] p-4 rounded-2xl flex items-center gap-4 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                            <div class="bg-white/5 p-3 rounded-xl">
                                <i data-lucide="clock" class="w-5 h-5 text-[#4185f4]"></i>
                            </div>
                            <div>
                                <div id="d-total" class="text-lg font-bold leading-tight"></div>
                                <div class="text-sm text-[#8c92a5] font-medium" data-i18n="ui_total_hours"></div>
                            </div>
                        </div>
                        <div class="bg-[#252736] p-4 rounded-2xl flex items-center gap-4 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                            <div class="bg-white/5 p-3 rounded-xl">
                                <i data-lucide="calendar" class="w-5 h-5 text-[#4185f4]"></i>
                            </div>
                            <div>
                                <div id="d-week" class="text-lg font-bold leading-tight"></div>
                                <div class="text-sm text-[#8c92a5] font-medium" data-i18n="ui_this_week"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#252736] p-4 rounded-2xl flex items-center gap-4 w-full hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                        <div class="bg-white/5 p-3 rounded-xl">
                            <i data-lucide="clock" class="w-5 h-5 text-[#4185f4]"></i>
                        </div>
                        <div>
                            <div id="d-day" class="text-lg font-bold leading-tight"></div>
                            <div class="text-sm text-[#8c92a5] font-medium" data-i18n="ui_today"></div>
                        </div>
                    </div>

                    <div class="mt-6 mb-8 group">
                        <div class="flex justify-between text-xs font-medium text-[#8c92a5] mb-2 px-1">
                            <span id="d-week-text"></span>
                            <span id="d-target-text"></span>
                        </div>
                        <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                            <div id="d-bar" class="h-full bg-[#4185f4]/60 rounded-full transition-all duration-700 ease-out group-hover:bg-[#4185f4]" style="width: 0%"></div>
                        </div>
                    </div>

                    </div>

                    <div class="flex flex-col gap-3">
                        <button id="btn-clock" class="w-full border rounded-xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 font-semibold disabled:opacity-60"></button>

                        <button id="btn-remove" class="w-full bg-[#2a1d22] border border-[#4a2428] text-[#f87171] rounded-xl py-3.5 flex items-center justify-center gap-2 hover:bg-[#382227] hover:border-[#632f35] hover:shadow-[0_0_15px_rgba(248,113,113,0.1)] active:scale-[0.98] transition-all duration-200 font-semibold disabled:opacity-60">
                            <i data-lucide="trash-2" class="w-5 h-5"></i> <span data-i18n="ui_remove_job"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-center pb-5 pt-2 text-[#707386] text-sm font-medium" data-i18n="ui_press_esc"></div>
        </div>
    </div>

    <script>
        let locale = {};
        let state = { jobs: [], current: null, max: 0, target: 40 };
        let selectedJob = null;
        let isUIOpen = false;
        let isAnimating = false;
        let busy = false;
        const ANIMATION_DURATION = 250;

        const IN_GAME = !!window.GetParentResourceName;
        const resourceName = () => (IN_GAME ? window.GetParentResourceName() : 'mp_multijob');

        const $ = (id) => document.getElementById(id);
        const uiContainer = $('ui-container');
        const viewList = $('view-list');
        const viewDetails = $('view-details');
        const jobList = $('job-list');
        const btnClock = $('btn-clock');
        const btnRemove = $('btn-remove');

        function t(key, ...args) {
            let str = Object.prototype.hasOwnProperty.call(locale, key) ? locale[key] : key;
            args.forEach((a) => { str = str.replace('%s', () => a); });
            return str;
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        const money = (n) => t('ui_currency', Number(n || 0).toLocaleString('en-US'));
        const hours = (sec) => t('ui_hours_short', ((sec || 0) / 3600).toFixed(1));
        const jobName = (j) => (j.unemployed ? t('ui_unemployed') : j.label);
        const gradeName = (j) => (j.unemployed ? t('ui_civilian') : j.gradeLabel);

        function applyStaticText() {
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                el.textContent = t(el.dataset.i18n);
            });
        }

        async function post(name, body) {
            if (!IN_GAME) return mockPost(name, body);
            try {
                const res = await fetch(`https://${resourceName()}/${name}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                    body: JSON.stringify(body || {}),
                });
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        const CARD_CLASS = 'job-card flex items-center bg-[#252736] p-4 rounded-2xl relative overflow-hidden group border border-transparent transition-all duration-200 cursor-pointer hover:bg-[#2a2d3e] hover:-translate-y-1 hover:shadow-lg active:scale-[0.98] hover:border-white/5';
        const ACCENT = '<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-[60%] bg-[#4185f4] rounded-r-full shadow-[0_0_10px_rgba(65,133,244,0.5)]"></div>';
        const BADGE = (text) => `<span class="shrink-0 whitespace-nowrap bg-[#4185f4]/15 text-[#4185f4] text-[10px] px-2 py-0.5 rounded-md uppercase font-bold tracking-wider">${esc(text)}</span>`;

        function jobCard(j) {
            const pay = j.unemployed ? '' : `
                        <span class="mx-1.5 opacity-50">•</span>
                        <span class="text-[#34d399]">${esc(money(j.salary))}</span>`;

            return `
            <div class="${CARD_CLASS}" data-job="${esc(j.job)}">
                ${j.current ? ACCENT : ''}
                <div class="bg-white/5 p-3.5 rounded-xl mr-4 group-hover:bg-white/10 transition-colors duration-200">
                    <i data-lucide="briefcase" class="w-[22px] h-[22px] text-[#8c92a5]"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-bold text-lg leading-none truncate ${j.current ? '' : 'text-white/90'}">${esc(jobName(j))}</span>
                        ${j.current ? BADGE(t('ui_current_job')) : ''}
                    </div>
                    <div class="text-[13px] text-[#8c92a5] font-medium flex items-center">
                        <span class="truncate">${esc(gradeName(j))}</span>${pay}
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-[#5a5e73] group-hover:text-white group-hover:translate-x-1 transition-all duration-200"></i>
            </div>`;
        }

        function renderList() {
            jobList.innerHTML = state.jobs.map(jobCard).join('');
            lucide.createIcons();
        }

        const CLOCK_BASE = 'w-full border rounded-xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-200 font-semibold disabled:opacity-60 ';
        const CLOCK_IN_CLASS = 'bg-[#1b2724] border-[#234233] text-[#34d399] hover:bg-[#1f312c] hover:border-[#2d5542] hover:shadow-[0_0_15px_rgba(52,211,153,0.1)]';
        const CLOCK_OUT_CLASS = 'bg-[#2a2519] border-[#4a3f24] text-[#fbbf24] hover:bg-[#362f1e] hover:border-[#63532f] hover:shadow-[0_0_15px_rgba(251,191,36,0.1)]';

        function renderDetails() {
            const j = state.jobs.find((x) => x.job === selectedJob);
            if (!j) return false;

            $('d-title').textContent = jobName(j);
            $('d-label').textContent = jobName(j);
            $('d-grade').textContent = gradeName(j);
            $('d-pay').textContent = t('ui_per_pay', money(j.salary));
            $('d-pay-wrap').classList.toggle('hidden', !!j.unemployed);
            $('d-current-wrap').classList.toggle('hidden', !j.current);
            $('d-stats').classList.toggle('hidden', !!j.unemployed);

            $('d-total').textContent = hours(j.total);
            $('d-week').textContent = hours(j.week);
            $('d-day').textContent = hours(j.day);

            const weekHours = (j.week || 0) / 3600;
            $('d-week-text').textContent = t('ui_hours_this_week', weekHours.toFixed(1));
            $('d-target-text').textContent = t('ui_hours_target', state.target);
            $('d-bar').style.width = Math.min(100, (weekHours / (state.target || 40)) * 100) + '%';

            let icon = 'toggle-left';
            let label = 'ui_clock_in';
            let style = CLOCK_IN_CLASS;

            if (j.unemployed) {
                label = 'ui_become_unemployed';
            } else if (j.current) {
                icon = 'toggle-right';
                label = 'ui_clock_out';
                style = CLOCK_OUT_CLASS;
            }

            btnClock.className = CLOCK_BASE + style;
            btnClock.classList.toggle('hidden', !!j.unemployed && !!j.current);
            btnClock.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i> <span>${esc(t(label))}</span>`;
            btnRemove.classList.toggle('hidden', !!j.unemployed || !!j.locked);

            lucide.createIcons();
            return true;
        }

        function applyData(data) {
            if (!data) return;
            state = data;
            renderList();

            const inDetails = !viewDetails.classList.contains('view-hidden');
            if (inDetails && !renderDetails()) {
                showListView();
            }
        }

        function showDetailsView(jobName) {
            if (isAnimating) return;
            selectedJob = jobName;
            if (!renderDetails()) return;
            isAnimating = true;

            viewList.classList.add('view-exit-left');
            setTimeout(() => {
                viewList.classList.add('view-hidden');
                viewList.classList.remove('view-exit-left');

                viewDetails.classList.remove('view-hidden');
                viewDetails.classList.add('view-enter-from-right');
                void viewDetails.offsetWidth;
                viewDetails.classList.remove('view-enter-from-right');

                setTimeout(() => { isAnimating = false; }, ANIMATION_DURATION);
            }, ANIMATION_DURATION);
        }

        function showListView() {
            if (isAnimating) return;
            isAnimating = true;

            viewDetails.classList.add('view-exit-right');
            setTimeout(() => {
                viewDetails.classList.add('view-hidden');
                viewDetails.classList.remove('view-exit-right');

                viewList.classList.remove('view-hidden');
                viewList.classList.add('view-enter-from-left');
                void viewList.offsetWidth;
                viewList.classList.remove('view-enter-from-left');

                setTimeout(() => { isAnimating = false; }, ANIMATION_DURATION);
            }, ANIMATION_DURATION);
        }

        function openUI() {
            if (isUIOpen) return;
            isUIOpen = true;

            viewDetails.classList.add('view-hidden');
            viewDetails.classList.remove('view-exit-right', 'view-enter-from-right');
            viewList.classList.remove('view-hidden', 'view-exit-left', 'view-enter-from-left');
            selectedJob = null;

            uiContainer.classList.add('ui-open');
        }

        function closeUI() {
            if (!isUIOpen) return;
            isUIOpen = false;
            uiContainer.classList.remove('ui-open');

            setTimeout(() => { post('closeUI'); }, 400);
        }

        jobList.addEventListener('click', (event) => {
            const card = event.target.closest('.job-card');
            if (card) showDetailsView(card.dataset.job);
        });

        $('btn-back').addEventListener('click', showListView);
        document.querySelectorAll('.btn-close').forEach((btn) => btn.addEventListener('click', closeUI));

        btnClock.addEventListener('click', async () => {
            if (busy || !selectedJob) return;
            const j = state.jobs.find((x) => x.job === selectedJob);
            if (!j) return;

            busy = true; btnClock.disabled = true;
            const res = await post(j.current ? 'clockOut' : 'clockIn', { job: j.job });
            busy = false; btnClock.disabled = false;
            if (res && res.data) applyData(res.data);
        });

        btnRemove.addEventListener('click', async () => {
            if (busy || !selectedJob) return;

            busy = true; btnRemove.disabled = true;
            const res = await post('removeJob', { job: selectedJob });
            busy = false; btnRemove.disabled = false;
            if (res && res.data) applyData(res.data);
        });

        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg.type === 'OPEN_MULTIJOB') {
                if (msg.locale) locale = msg.locale;
                applyStaticText();
                applyData(msg.data);
                openUI();
            } else if (msg.type === 'UPDATE_JOBS') {
                applyData(msg.data);
            } else if (msg.type === 'CLOSE_UI') {
                closeUI();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && isUIOpen) closeUI();
        });

        let mockState = null;

        function mockPost(name, body) {
            if (!mockState) return null;
            const j = mockState.jobs.find((x) => x.job === (body && body.job));
            if (name === 'clockIn' && j) mockState.jobs.forEach((x) => { x.current = x === j; });
            if (name === 'clockOut' && j) {
                mockState.jobs.forEach((x) => { x.current = !!x.unemployed; });
            }
            if (name === 'removeJob' && j && !j.unemployed) mockState.jobs = mockState.jobs.filter((x) => x !== j);
            mockState.jobs.sort((a, b) => (Number(b.current) - Number(a.current)) || (Number(!!a.unemployed) - Number(!!b.unemployed)));
            return { ok: true, data: JSON.parse(JSON.stringify(mockState)) };
        }

        if (!IN_GAME) {
            document.body.style.backgroundImage = 'radial-gradient(circle at center, #2a2a35 0%, #0d0d12 100%)';
            setTimeout(async () => {
                try { locale = await (await fetch('../locales/en.json')).json(); } catch (e) {}
                mockState = {
                    max: 3, target: 40, current: 'police',
                    jobs: [
                        { job: 'police', label: 'Los Santos Police Dept.', grade: 4, gradeLabel: 'Chief of Police', salary: 1200, total: 190800, week: 54000, day: 3600, current: true },
                        { job: 'mechanic', label: "Benny's Motorworks", grade: 1, gradeLabel: 'Mechanic', salary: 450, total: 7200, week: 0, day: 0, current: false },
                        { job: 'unemployed', unemployed: true, locked: true, label: '', gradeLabel: '', salary: 0, total: 0, week: 0, day: 0, current: false },
                    ],
                };
                applyStaticText();
                applyData(mockState);
                openUI();
            }, 300);
        }

        lucide.createIcons();
    </script>
</body>
</html>
